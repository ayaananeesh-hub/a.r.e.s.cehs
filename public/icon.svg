<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#14213d" />
      <stop offset="60%" stop-color="#080f1e" />
      <stop offset="100%" stop-color="#020611" />
    </radialGradient>
    <radialGradient id="mars" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff7043" />
      <stop offset="40%" stop-color="#e64a19" />
      <stop offset="85%" stop-color="#bf360c" />
      <stop offset="100%" stop-color="#5d1604" />
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dd0e1" />
      <stop offset="100%" stop-color="#00acc1" />
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Space Container -->
  <rect width="512" height="512" rx="100" fill="url(#sky)" />

  <!-- Stars -->
  <circle cx="90" cy="80" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="210" cy="60" r="1.5" fill="#4dd0e1" opacity="0.9" />
  <circle cx="390" cy="110" r="2" fill="#ffffff" opacity="0.85" />
  <circle cx="430" cy="70" r="3" fill="#ffb74d" opacity="0.7" />
  <circle cx="70" cy="220" r="1.8" fill="#ffffff" opacity="0.6" />
  <circle cx="450" cy="240" r="2.2" fill="#4dd0e1" opacity="0.8" />

  <!-- Mars Horizon Curve -->
  <path d="M 0 320 Q 256 220 512 320 L 512 512 L 0 512 Z" fill="url(#mars)" />
  <path d="M 0 320 Q 256 220 512 320" stroke="#ff8a65" stroke-width="4" fill="none" opacity="0.5" />

  <!-- Craters on Mars -->
  <ellipse cx="140" cy="390" rx="42" ry="16" fill="#872207" opacity="0.7" />
  <ellipse cx="138" cy="388" rx="40" ry="14" fill="#6d1b06" opacity="0.9" />
  <ellipse cx="380" cy="420" rx="60" ry="20" fill="#872207" opacity="0.7" />
  <ellipse cx="378" cy="418" rx="58" ry="18" fill="#6d1b06" opacity="0.9" />

  <!-- Headlight beam -->
  <polygon points="280,240 460,190 470,290" fill="url(#glow)" opacity="0.18" />

  <!-- Rover Body -->
  <!-- Mast & Camera -->
  <line x1="220" y1="230" x2="220" y2="160" stroke="#b0bec5" stroke-width="7" stroke-linecap="round" />
  <rect x="206" y="145" width="28" height="18" rx="4" fill="#37474f" stroke="#4dd0e1" stroke-width="2" />
  <circle cx="215" cy="154" r="5" fill="#4dd0e1" filter="url(#neon)" />
  <circle cx="226" cy="154" r="3" fill="#ff7043" />

  <!-- Antenna -->
  <line x1="160" y1="230" x2="140" y2="175" stroke="#78909c" stroke-width="4" stroke-linecap="round" />
  <ellipse cx="138" cy="172" rx="14" ry="7" fill="none" stroke="#4dd0e1" stroke-width="3" transform="rotate(-25 138 172)" />
  <circle cx="138" cy="172" r="3" fill="#ffffff" />

  <!-- Main Chassis -->
  <rect x="150" y="225" width="140" height="42" rx="10" fill="#f57c00" stroke="#ffe082" stroke-width="3" />
  <rect x="165" y="232" width="110" height="14" rx="3" fill="#263238" />
  <!-- Solar panels lines -->
  <line x1="185" y1="232" x2="185" y2="246" stroke="#4dd0e1" stroke-width="2" opacity="0.8" />
  <line x1="205" y1="232" x2="205" y2="246" stroke="#4dd0e1" stroke-width="2" opacity="0.8" />
  <line x1="225" y1="232" x2="225" y2="246" stroke="#4dd0e1" stroke-width="2" opacity="0.8" />
  <line x1="245" y1="232" x2="245" y2="246" stroke="#4dd0e1" stroke-width="2" opacity="0.8" />

  <!-- Robotic Arm -->
  <path d="M 285 245 L 325 255 L 340 280" fill="none" stroke="#eceff1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="340" cy="280" r="6" fill="#4dd0e1" filter="url(#neon)" />

  <!-- Rocker-Bogie Suspension Legs -->
  <line x1="170" y1="260" x2="140" y2="295" stroke="#455a64" stroke-width="6" stroke-linecap="round" />
  <line x1="220" y1="260" x2="220" y2="295" stroke="#455a64" stroke-width="6" stroke-linecap="round" />
  <line x1="270" y1="260" x2="300" y2="295" stroke="#455a64" stroke-width="6" stroke-linecap="round" />

  <!-- Wheels -->
  <!-- Left Wheel -->
  <circle cx="140" cy="295" r="22" fill="#212121" stroke="#ffb74d" stroke-width="4" />
  <circle cx="140" cy="295" r="10" fill="#424242" />
  <circle cx="140" cy="295" r="4" fill="#4dd0e1" />
  <!-- Center Wheel -->
  <circle cx="220" cy="295" r="22" fill="#212121" stroke="#ffb74d" stroke-width="4" />
  <circle cx="220" cy="295" r="10" fill="#424242" />
  <circle cx="220" cy="295" r="4" fill="#4dd0e1" />
  <!-- Right Wheel -->
  <circle cx="300" cy="295" r="22" fill="#212121" stroke="#ffb74d" stroke-width="4" />
  <circle cx="300" cy="295" r="10" fill="#424242" />
  <circle cx="300" cy="295" r="4" fill="#4dd0e1" />

  <!-- Mission Badge Title Subtext -->
  <text x="256" y="475" text-anchor="middle" font-family="'Orbitron', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">MARS ROVER</text>
  <text x="256" y="495" text-anchor="middle" font-family="'Rajdhani', Arial, sans-serif" font-weight="700" font-size="14" fill="#4dd0e1" letter-spacing="6">EXPEDITION MISSION</text>
</svg>
